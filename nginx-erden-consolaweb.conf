server {
    server_name erden.com.ar www.erden.com.ar;

    client_max_body_size 2M;

    # ============================================
    # CONFIGURACION PARA PRESENTARTE - VERSION SIMPLE
    # ============================================

    location /Presentarte {
        root /var/www/html;
        add_header Access-Control-Allow-Origin "*" always;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/var/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param QUERY_STRING $query_string;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
            add_header Access-Control-Allow-Origin "*" always;
        }

        try_files $uri $uri/ =404;
    }

    # ============================================
    # CONFIGURACION PARA /numeros (CORREGIDA CON ^~)
    # ============================================
    location ^~ /numeros {
        root /var/www/html;
        index index.php index.html index.htm;

        try_files $uri $uri/ /numeros/index.php?$query_string;

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/var/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
        }
    }

    # ============================================
    # CONFIGURACION PARA ip.html
    # ============================================
    location = /ip.html {
        alias /var/www/html/foodsal/file/ip.html;
        default_type text/plain;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Cache-Control, Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Cache-Control, Content-Type, Authorization";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # ============================================
    # CONFIGURACION PARA CONSOLAWEB
    # ============================================
    # Requiere:
    #   ln -s /var/www/html/consola-web/public /var/www/html/erden/public/consolaweb
    #   APP_URL=https://erden.com.ar/consolaweb en el .env de ConsolaWeb.
    location ^~ /consolaweb {
        # Las cabeceras COOP/COEP las agrega el middleware EnableCrossOriginIsolation
        # de Laravel. No duplicar aquí para evitar valores inválidos.

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass unix:/var/run/php-fpm/www.sock;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
            fastcgi_read_timeout 300;
            fastcgi_connect_timeout 300;
            fastcgi_send_timeout 300;
        }

        try_files $uri $uri/ /consolaweb/index.php?$query_string;
    }

    # ============================================
    # CONFIGURACION PARA ERDEN
    # ============================================
    root /var/www/html/erden/public;
    index index.php index.html index.htm;

    access_log /var/log/nginx/erden_access.log;
    # WebSocket proxy para Reverb (Pusher)
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    error_log /var/log/nginx/erden_error.log;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    add_header Access-Control-Max-Age 1728000 always;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php-fpm/www.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/erden.com.ar/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/erden.com.ar/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = www.erden.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = erden.com.ar) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name erden.com.ar www.erden.com.ar;
    return 404; # managed by Certbot

}
